version: '3.9'

services:
  backend:
    build:
      context: .
      target: backend
    container_name: travel-ai-backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./apps/backend/config:/app/config
      - ./apps/backend/migrations:/app/migrations
    restart: unless-stopped

  frontend:
    build:
      context: .
      target: frontend
    container_name: travel-ai-frontend
    ports:
      - "3000:3000"
    restart: unless-stopped
